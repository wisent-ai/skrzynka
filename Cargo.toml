[package]
name = "skrzynka"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "Multi-mailbox email operations with credentials resolved from Skarbiec"
license = "Apache-2.0"
repository = "https://github.com/wisent-ai/skrzynka"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
imap = "3.0.0-alpha.15"
jsonwebtoken = "9"
lettre = "0.11"
mailparse = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.10", features = ["serde", "v4"] }
